# /etc/xdg/nrmaos/picom.conf
# Lightweight compositor configuration for hardware-accelerated local nrmaOS sessions.
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.28;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
