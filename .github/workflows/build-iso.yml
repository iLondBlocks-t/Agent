name: Build Debian Live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/build-iso.sh"
      - "scripts/test-source.sh"
      - "shell/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Run source checks
        run: ./scripts/test-source.sh

      - name: Build ISO
        run: ./scripts/build-iso.sh

      - name: Verify ISO and create SHA256 checksum
        run: |
          iso=live-image-amd64.hybrid.iso
          test -s "$iso"
          xorriso -indev "$iso" -report_el_torito plain
          sha256sum "$iso" > "$iso.sha256"
          cat "$iso.sha256"

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: nrmaos-amd64-live-iso
          path: |
            live-image-amd64.hybrid.iso
            live-image-amd64.hybrid.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
