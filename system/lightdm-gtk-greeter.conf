[greeter]
background = /usr/share/nrmaos/wallpapers/aurora-dark.png
theme-name = nrmaOS-Login
icon-theme-name = Adwaita
font-name = Sans 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %a %H:%M
default-user-image = /usr/share/nrmaos/icons/nrmaos-logo.svg
position = 50%,center 50%,center
